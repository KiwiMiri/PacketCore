[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packetcore"
version = "0.1.0"
description = "OT/IT anomaly detection with multi-view ensemble"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
gnn = ["torch_geometric"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
packetcore = "packetcore.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["packetcore*"]
